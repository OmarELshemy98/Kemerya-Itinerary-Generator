<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" preserveAspectRatio="none">
  <defs>
    <radialGradient id="parchmentGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F5EBD3" />
      <stop offset="45%" stop-color="#EBD9B4" />
      <stop offset="75%" stop-color="#D9C496" />
      <stop offset="100%" stop-color="#BF9F6E" />
    </radialGradient>
    <radialGradient id="cornerStain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B6F47" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#8B6F47" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B6F47" stop-opacity="0" />
    </radialGradient>
    <filter id="agedGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" />
      <feColorMatrix
        type="matrix"
        values="0 0 0 0 0.42
                0 0 0 0 0.32
                0 0 0 0 0.18
                0 0 0 0.08 0"
      />
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>
    <filter id="roughEdge" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" />
    </filter>
    <pattern id="fineGrain" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="transparent" />
      <circle cx="8" cy="12" r="0.5" fill="#9B7B4A" opacity="0.25" />
      <circle cx="32" cy="8" r="0.4" fill="#A88550" opacity="0.2" />
      <circle cx="48" cy="28" r="0.6" fill="#8B6B3F" opacity="0.3" />
