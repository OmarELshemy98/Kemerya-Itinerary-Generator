      <circle cx="52" cy="52" r="0.45" fill="#9B7B4A" opacity="0.22" />
      <circle cx="26" cy="55" r="0.5" fill="#A88550" opacity="0.2" />
      <circle cx="4" cy="34" r="0.3" fill="#8B6B3F" opacity="0.28" />
      <circle cx="40" cy="45" r="0.4" fill="#B89562" opacity="0.15" />
    </pattern>
  </defs>

  <g filter="url(#roughEdge)">
